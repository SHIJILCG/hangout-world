# Render blueprint: deploys the Colyseus game server on the free plan.
# In the Render dashboard: New + -> Blueprint -> select this repo -> Apply.
services:
  - type: web
    name: hangout-world-server
    runtime: node
    plan: free
    # Keep shared physics and generated collision files available to the server.
    buildCommand: npm --prefix server ci && npm --prefix server run build
    startCommand: npm --prefix server start
    healthCheckPath: /health
